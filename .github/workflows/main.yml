.dark { --background: 222 26% 7%; --foreground: 40 22% 95%; --card: 222 20% 11%; --card-foreground: 40 22% 95%; --popover: 222 20% 11%; --popover-foreground: 40 22% 95%; --primary: 38 94% 56%; --primary-foreground: 222 30% 8%; --secondary: 205 18% 18%; --secondary-foreground: 40 22% 95%; --muted: 205 16% 16%; --muted-foreground: 210 14% 68%; --accent: 174 58% 45%; --accent-foreground: 222 30% 8%; --destructive: 0 68% 52%; --destructive-foreground: 0 0% 98%; --border: 210 16% 26%; --input: 210 16% 26%; --ring: 38 94% 56%; --chart-1: 220 70% 50%; --chart-2: 160 60% 45%; --chart-3: 30 80% 55%; --chart-4: 280 65% 60%; --chart-5: 340 75% 55%; --sidebar-background: 240 5.9% 10%; --sidebar-foreground: 240 4.8% 95.9%; --sidebar-primary: 224.3 76.3% 48%; --sidebar-primary-foreground: 0 0% 100%; --sidebar-accent: 240 3.7% 15.9%; --sidebar-accent-foreground: 240 4.8% 95.9%; --sidebar-border: 240 3.7% 15.9%; --sidebar-ring: 217.2 91.2% 59.8%; }

* { border-color: hsl(var(--border)); outline-color: hsl(var(--ring) / .5); }

body { background-color: hsl(var(--background)); font-family: var(--font-body); color: hsl(var(--foreground)); }

