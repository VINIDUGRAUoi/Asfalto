 <body>
  <div id="root"><div class="fixed inset-0 touch-none select-none overflow-hidden overscroll-none bg-background"><canvas class="block h-full w-full" data-engine="three.js r171" width="459" height="923"></canvas><div class="absolute inset-0 z-40 flex flex-col items-center justify-between gap-4 overflow-y-auto bg-gradient-to-b from-background/95 via-background/25 to-background/92 px-6 py-6 text-center"><div><h1 class="font-display text-6xl leading-none tracking-wide text-primary sm:text-7xl">ASFALTO</h1><p class="mt-2 font-heading text-sm tracking-[0.42em] text-foreground/80">CIDADE ABERTA</p><p class="mx-auto mt-3 max-w-md text-[12px] leading-relaxed text-muted-foreground">Cidade aberta com carros para dirigir e roubar, pedestres que conversam, andam e se assustam, e polícia com nível de procurado: cada crime acende uma estrela e as viaturas vêm atrás. Rosto e corpo expressivos em todo mundo, com ciclo de dia e noite e chuva.</p></div><div class="w-full max-w-sm"><button class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-10 rounded-md px-8 w-full font-heading text-lg tracking-widest">NOVO JOGO</button><div class="mt-3 flex items-center justify-center gap-2"><button type="button" class="rounded-md border px-3 py-1.5 font-heading text-[10px] tracking-widest border-border bg-card/60 text-muted-foreground">Baixa</button><button type="button" class="rounded-md border px-3 py-1.5 font-heading text-[10px] tracking-widest border-primary bg-primary/25 text-foreground">Média</button><button type="button" class="rounded-md border px-3 py-1.5 font-heading text-[10px] tracking-widest border-border bg-card/60 text-muted-foreground">Alta</button></div><p class="mt-1 text-[10px] text-muted-foreground">Gráficos: baixa, média e alta. A troca recarrega a cidade no perfil escolhido.</p></div><div class="w-full max-w-md"><div class="rounded-lg border border-border bg-card/60 p-3 text-left"><p class="font-heading text-[11px] tracking-widest text-primary">CONTROLES</p><ul class="mt-2 space-y-1 text-[11px] text-muted-foreground"><li class="flex justify-between gap-3"><span class="text-foreground/80">Analógico (canto esquerdo)</span><span>andar e dirigir</span></li><li class="flex justify-between gap-3"><span class="text-foreground/80">Arraste no lado direito</span><span>girar a câmera</span></li><li class="flex justify-between gap-3"><span class="text-foreground/80">CORRER / FREIO MÃO</span><span>correr a pé, derrapar de carro</span></li><li class="flex justify-between gap-3"><span class="text-foreground/80">PULAR / SOCAR</span><span>saltar e atacar</span></li><li class="flex justify-between gap-3"><span class="text-foreground/80">AGACHAR</span><span>agachar e levantar</span></li><li class="flex justify-between gap-3"><span class="text-foreground/80">ENTRAR NO CARRO</span><span>aparece quando há um carro perto</span></li><li class="flex justify-between gap-3"><span class="text-foreground/80">No computador</span><span>WASD, Shift, Espaço, C, E (carro) e F (soco)</span></li></ul></div></div></div></div><div role="region" aria-label="Notifications (F8)" tabindex="-1" style="pointer-events: none;"><ol tabindex="-1" class="fixed top-0 z-[100] flex max-h-screen w-full flex-col-reverse p-4 sm:bottom-0 sm:right-0 sm:top-auto sm:flex-col md:max-w-[420px]"></ol></div></div>
 

</body></html>
